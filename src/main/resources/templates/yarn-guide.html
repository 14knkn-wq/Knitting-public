<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>毛糸・推奨針号数対応表 | Knitting</title>

    <style>
        .yarn-guide-table-wrapper {
            overflow-x: auto;
        }

        .yarn-guide-table-wrapper th,
        .yarn-guide-table-wrapper td {
            white-space: nowrap;
        }
    </style>
</head>

<body>

    <th:block th:if="${isAuthenticated}">
        <div
            th:replace="~{fragments/header :: authenticatedHeader('yarn-guide')}">
        </div>
    </th:block>

    <th:block th:unless="${isAuthenticated}">
        <div
            th:replace="~{fragments/header :: guestHeader('default')}">
        </div>
    </th:block>

	<main>
	    <h1>毛糸・推奨針号数対応表</h1>

	    <div class="yarn-guide-table-wrapper">
	        <table>
	            <thead>
	                <tr>
	                    <th>毛糸の太さ</th>
	                    <th>100gあたりの長さ（m）</th>
	                    <th>推奨棒針</th>
	                    <th>推奨かぎ針</th>
	                </tr>
	            </thead>

	            <tbody>
	                <tr th:each="standard : ${yarnStandards}">
	                    <td th:text="${standard.displayName}">
	                        毛糸の太さ
	                    </td>

	                    <td th:text="${standard.lengthRangeLabel}">
	                        100gあたりの長さ
	                    </td>

	                    <td>
	                        <div th:text="${standard.knittingNeedleNumberLabel}">
	                            棒針号数
	                        </div>
	                        <div th:text="${standard.knittingNeedleMmLabel}">
	                            棒針mm
	                        </div>
	                    </td>

	                    <td>
	                        <div th:text="${standard.crochetHookNumberLabel}">
	                            かぎ針号数
	                        </div>
	                        <div th:text="${standard.crochetHookMmLabel}">
	                            かぎ針mm
	                        </div>
	                    </td>
	                </tr>
	            </tbody>
	        </table>
	    </div>
		
		<div class="yarn-guide-note">
		    <p>
		        この対応表は、一般的なウール系ストレートヤーンを基準とした目安です。
		    </p>
		    <p>
		        素材、撚り、膨らみ、毛足、糸の構造などによって、<br>
		        実際の太さや適した針サイズは異なります。
		    </p>
		    <p>
		        商品にメーカー推奨値が記載されている場合はメーカー表示を優先し、<br>
		        実際の糸と針で試し編みすることをおすすめします。
		    </p>
		</div>

	    <p>
	        <a th:href="@{/}">トップへ戻る</a>
	    </p>
	</main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>

</html>
