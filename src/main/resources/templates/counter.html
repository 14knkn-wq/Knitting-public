<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡易カウンター | Knitting</title>
	<script th:src="@{/js/counter.js}" defer></script>
</head>
<body>

    <th:block th:if="${isAuthenticated}">
        <div
            th:replace="~{fragments/header :: authenticatedHeader('counter')}">
        </div>
    </th:block>

    <th:block th:unless="${isAuthenticated}">
        <div
            th:replace="~{fragments/header :: guestHeader('default')}">
        </div>
    </th:block>

    <main>
        <h1>簡易カウンター</h1>

        <p>作品とは別に、目数・段数を手軽に数えられるカウンターです。</p>

        <div id="storage-warning" hidden>
            カウンターの値を保存できません。ページの移動・再読み込み・終了後は、現在の値を保持できない場合があります。
        </div>

        <section>
            <h2>目数</h2>

            <div>
                <button type="button"
                        id="stitch-decrement-button"
                        disabled>
                    －
                </button>

                <input type="text"
                       id="stitch-count"
                       inputmode="numeric"
                       value="0"
                       aria-label="目数">

                <button type="button"
                        id="stitch-increment-button">
                    ＋
                </button>
            </div>

            <p id="stitch-error" hidden></p>

            <button type="button"
                    id="stitch-reset-button">
                リセット
            </button>
        </section>

        <section>
            <h2>段数</h2>

            <div>
                <button type="button"
                        id="row-decrement-button"
                        disabled>
                    －
                </button>

                <input type="text"
                       id="row-count"
                       inputmode="numeric"
                       value="0"
                       aria-label="段数">

                <button type="button"
                        id="row-increment-button">
                    ＋
                </button>
            </div>

            <p id="row-error" hidden></p>

            <button type="button"
                    id="row-reset-button">
                リセット
            </button>
        </section>

        <button type="button"
                id="reset-all-button">
            すべてリセット
        </button>

        <p>
            <a th:href="@{/}">トップへ戻る</a>
        </p>
    </main>

    <footer th:replace="~{fragments/footer :: footer}"></footer>

</body>
</html>
