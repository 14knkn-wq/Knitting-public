<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
	<title>ログイン | Knitting</title>

	<link rel="stylesheet"
	          th:href="@{/css/common.css}">
	<link rel="stylesheet"
	          th:href="@{/css/login.css}">
</head>

<body>
	
	<header th:replace="~{fragments/header :: guestHeader('login')}"></header>

    <main>
        <h1>ログイン</h1>
		
		<p th:if="${param.registered != null}">
		    ユーザー登録が完了しました。ログインしてください。
		</p>
		
		<p th:if="${param.required != null}">
		    この機能を利用するにはログインしてください。
		</p>
		
		<p th:if="${param.error != null}">
		    ユーザー名またはパスワードが正しくありません。
		</p>

        <form th:action="@{/login}" method="post">

            <div>
                <label for="username">ユーザー名</label>
                <input
                    type="text"
                    id="username"
                    name="username"
                    autocomplete="username"
                    required>
            </div>

			<div>
			    <label for="password">パスワード</label>

			    <input
			        type="password"
			        id="password"
			        name="password"
			        autocomplete="current-password"
			        required>

			    <button
			        type="button"
			        data-password-toggle
			        aria-controls="password">
			        表示
			    </button>
			</div>
			
			<div>
			    <label>
			        <input
			            type="checkbox"
			            name="remember-me">
			        30日間ログイン状態を保持する
			    </label>
			</div>

            <button type="submit" data-login-submit>ログイン</button>

        </form>

        <p>
            <a th:href="@{/}">トップへ戻る</a>
        </p>
    </main>
	
	<footer th:replace="~{fragments/footer :: footer}"></footer>

	<script th:src="@{/js/password-toggle.js}"></script>
	<script th:src="@{/js/login.js}"></script>
	
</body>

</html>
